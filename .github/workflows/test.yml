name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run CLI tests
        run: python -m unittest discover -s tests -v

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill frontmatter and references
        run: |
          python - <<'PY'
          import pathlib, re, sys
          skill = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          assert skill.startswith("---\n"), "SKILL.md must start with frontmatter"
          header = skill.split("---", 2)[1]
          for key in ("name:", "description:"):
              assert re.search(rf"^{key}", header, re.M), f"missing {key}"
          for ref in re.findall(r"`(references/[^`]+)`", skill):
              assert pathlib.Path(ref).is_file(), f"missing {ref}"
          print("skill ok")
          PY
      - name: Check installer syntax
        run: bash -n install.sh
